<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M016 Right Triangle Router</title><style>:root{--p:#1a1e24;--ink:#f5f6f7;--muted:#adb4be;--line:#343b46;--gold:#b9913e;--blue:#5687c3;--green:#579b74;--red:#b86a6a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0c0e11,#15191e);color:var(--ink);font:16px/1.45 system-ui}.w{max-width:1100px;margin:auto;padding:28px}.card{background:var(--p);border:1px solid var(--line);border-radius:19px;padding:20px;margin-bottom:16px}.brand{font-size:13px;font-weight:850;letter-spacing:.14em}.title{font-size:34px;font-weight:850;margin:6px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.choice{padding:13px;border:1px solid #3d4550;border-radius:13px;background:#111419;margin:9px 0;cursor:pointer}.choice.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}button{padding:10px 13px;border-radius:11px;border:1px solid #454d59;background:#262d36;color:var(--ink);font-weight:750;cursor:pointer}.primary{background:var(--gold);border-color:var(--gold);color:#111}.good{color:#7bc99e}.bad{color:#e3a2a2}.route{font-size:27px;font-weight:850;color:var(--gold)}svg{width:100%;height:330px;background:#111419;border:1px solid var(--line);border-radius:15px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="card"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M016</div><div class="title">Right-Triangle Router</div><div class="muted">Choose the route from what is known and what is requested—not from whichever formula you remember first.</div></div><div class="grid"><div class="card"><div id="q" style="font-size:20px;font-weight:800"></div><div id="choices"></div><button class="primary" id="check">Check route</button><button id="next">Next</button><div id="result" style="margin-top:14px"></div></div><div class="card"><div class="route" id="route">Route first.</div><svg viewBox="0 0 500 330"><polyline points="80,270 410,270 410,65 80,270" fill="#5687c31c" stroke="#5687c3" stroke-width="5"/><rect x="388" y="248" width="22" height="22" fill="none" stroke="#f5f6f7" stroke-width="3"/><text x="230" y="300" fill="#adb4be" font-size="18">leg</text><text x="420" y="180" fill="#adb4be" font-size="18">leg</text><text x="205" y="145" fill="#b9913e" font-size="18" transform="rotate(-32 205 145)">hypotenuse</text></svg></div></div></div><script>
const qs=[{q:'Both legs are known. You need the hypotenuse.',a:0,c:['Pythagorean theorem','SOHCAHTOA','30-60-90 ratio'],r:'Pythagorean: a²+b²=c².',w:'Two sides and a missing third side is a direct Pythagorean structure.'},{q:'One acute angle and the adjacent leg are known. You need the hypotenuse.',a:1,c:['Pythagorean theorem','Cosine ratio','45-45-90 ratio'],r:'Cosine: cos θ = adjacent / hypotenuse.',w:'An acute angle plus one side points to trig unless a special-triangle ratio is explicitly available.'},{q:'A right triangle has one acute angle of 30° and the short leg is 7.',a:2,c:['Generic trig only','Pythagorean first','30-60-90 ratio'],r:'30-60-90: short : long : hypotenuse = 1 : √3 : 2.',w:'Recognize the special triangle before doing heavier work.'},{q:'An isosceles right triangle has leg length 9.',a:2,c:['Sine ratio','30-60-90 ratio','45-45-90 ratio'],r:'45-45-90: leg : leg : hypotenuse = 1 : 1 : √2.',w:'Isosceles + right means 45-45-90.'}];let i=0,sel=null;const $=x=>document.getElementById(x);function render(){let q=qs[i];$('q').textContent=q.q;$('choices').innerHTML=q.c.map((x,j)=>`<div class="choice" data-j="${j}">${x}</div>`).join('');document.querySelectorAll('.choice').forEach(e=>e.onclick=()=>{sel=+e.dataset.j;document.querySelectorAll('.choice').forEach(z=>z.classList.remove('on'));e.classList.add('on')});$('result').textContent='';$('route').textContent='Route first.';sel=null}$('check').onclick=()=>{if(sel===null)return;let q=qs[i],ok=sel===q.a;$('result').className=ok?'good':'bad';$('result').textContent=(ok?'Correct. ':'Revise. ')+q.w;$('route').textContent=q.r};$('next').onclick=()=>{i=(i+1)%qs.length;render()};render();
</script></body></html>
