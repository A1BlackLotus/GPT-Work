<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M003 Systems Intersection Lab</title>
<style>
:root{--bg:#0f1115;--panel:#1a1e24;--ink:#f4f5f6;--muted:#aeb4be;--line:#343a44;--gold:#b9913e;--blue:#4d82c4;--green:#4e9a72;--red:#b96767}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0f12,#15181d);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.head,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.head{margin-bottom:18px}.brand{font-size:13px;letter-spacing:.14em;font-weight:800;color:#d8dbe0}.title{font-size:34px;font-weight:850;margin:7px 0 3px}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:750;margin:10px 0 5px;color:#d8dce2}input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #3b424e;background:#101318;color:var(--ink);font:inherit}button{border:1px solid #434b58;background:#262c35;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:750;cursor:pointer}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.primary{background:var(--gold);border-color:var(--gold);color:#111}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#101318;border:1px solid var(--line);border-radius:13px;padding:12px}.metric b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.metric span{font-size:24px;font-weight:850}canvas{width:100%;height:420px;background:#101318;border:1px solid var(--line);border-radius:15px;margin-top:12px}.pill{background:#11151a;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}.good{color:#79c79d}.bad{color:#e0a6a6}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<div class="head"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M003</div><div class="title">Systems Intersection Lab</div><div class="sub">Change two lines and watch the solution count + intersection change.</div></div>
<div class="grid"><div class="card"><h2>Line controls</h2><div class="row"><div><label>m₁</label><input id="m1" type="number" step=".25" value="1"></div><div><label>b₁</label><input id="b1" type="number" step=".5" value="1"></div></div><div class="row"><div><label>m₂</label><input id="m2" type="number" step=".25" value="-1"></div><div><label>b₂</label><input id="b2" type="number" step=".5" value="5"></div></div><div class="buttons"><button class="primary" id="inter">Intersect</button><button id="parallel">Parallel</button><button id="same">Same line</button></div><div class="pill" id="eqs"></div></div>
<div class="card"><h2>Prediction + result</h2><div class="metricgrid"><div class="metric"><b>Solutions</b><span id="count"></span></div><div class="metric"><b>x</b><span id="ix"></span></div><div class="metric"><b>y</b><span id="iy"></span></div></div><div class="pill" id="why"></div></div></div>
<div class="card" style="margin-top:18px"><canvas id="g" width="1100" height="500"></canvas><div class="muted">Rule: different slopes → one solution. Same slope + different intercepts → none. Same line → infinitely many.</div></div></div>
<script>
const $=x=>document.getElementById(x),fmt=n=>Math.abs(n)<1e-9?'0':(Math.round(n*1000)/1000).toString();
function lineEq(m,b){return `y = ${fmt(m)}x ${b>=0?'+':'−'} ${fmt(Math.abs(b))}`}
function update(){let m1=+$('m1').value,b1=+$('b1').value,m2=+$('m2').value,b2=+$('b2').value;$('eqs').innerHTML=`<b>${lineEq(m1,b1)}</b><br><b>${lineEq(m2,b2)}</b>`;let one=Math.abs(m1-m2)>1e-9,same=!one&&Math.abs(b1-b2)<1e-9,x=null,y=null;if(one){x=(b2-b1)/(m1-m2);y=m1*x+b1;$('count').textContent='1';$('ix').textContent=fmt(x);$('iy').textContent=fmt(y);$('why').innerHTML='<span class="good"><b>Different slopes:</b> the lines cross exactly once.</span>'}else if(same){$('count').textContent='∞';$('ix').textContent='—';$('iy').textContent='—';$('why').innerHTML='<span class="good"><b>Same equation:</b> every point on one line also lies on the other.</span>'}else{$('count').textContent='0';$('ix').textContent='—';$('iy').textContent='—';$('why').innerHTML='<span class="bad"><b>Same slope, different intercepts:</b> parallel lines never meet.</span>'}draw(m1,b1,m2,b2,x,y)}
function draw(m1,b1,m2,b2,ix,iy){let c=$('g'),q=c.getContext('2d'),w=c.width,h=c.height;q.clearRect(0,0,w,h);q.fillStyle='#101318';q.fillRect(0,0,w,h);let X=x=>w/2+x*45,Y=y=>h/2-y*45;q.strokeStyle='#3b424d';q.lineWidth=1;for(let i=-12;i<=12;i++){q.beginPath();q.moveTo(X(i),0);q.lineTo(X(i),h);q.stroke()}for(let i=-6;i<=6;i++){q.beginPath();q.moveTo(0,Y(i));q.lineTo(w,Y(i));q.stroke()}q.strokeStyle='#77808e';q.lineWidth=2;q.beginPath();q.moveTo(0,Y(0));q.lineTo(w,Y(0));q.stroke();q.beginPath();q.moveTo(X(0),0);q.lineTo(X(0),h);q.stroke();function L(m,b,col){q.strokeStyle=col;q.lineWidth=5;q.beginPath();q.moveTo(X(-14),Y(m*(-14)+b));q.lineTo(X(14),Y(m*14+b));q.stroke()}L(m1,b1,'#4d82c4');L(m2,b2,'#b9913e');if(ix!==null&&Math.abs(ix)<14&&Math.abs(iy)<7){q.fillStyle='#f4f5f6';q.beginPath();q.arc(X(ix),Y(iy),7,0,Math.PI*2);q.fill()}}
['m1','b1','m2','b2'].forEach(id=>$(id).oninput=update);$('inter').onclick=()=>{$('m1').value=1;$('b1').value=1;$('m2').value=-1;$('b2').value=5;update()};$('parallel').onclick=()=>{$('m1').value=1;$('b1').value=1;$('m2').value=1;$('b2').value=4;update()};$('same').onclick=()=>{$('m1').value=1;$('b1').value=1;$('m2').value=1;$('b2').value=1;update()};update();
</script></body></html>
