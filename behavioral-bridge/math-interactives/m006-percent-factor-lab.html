<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M006 Percent Factor Lab</title>
<style>
:root{--panel:#1a1e24;--ink:#f4f5f6;--muted:#aeb4be;--line:#343a44;--gold:#b9913e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0f12,#15181d);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.head,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.head{margin-bottom:18px}.brand{font-size:13px;letter-spacing:.14em;font-weight:800;color:#d8dbe0}.title{font-size:34px;font-weight:850;margin:7px 0 3px}.sub,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:750;margin:10px 0 5px;color:#d8dce2}input{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #3b424e;background:#101318;color:var(--ink);font:inherit}button{border:1px solid #434b58;background:#262c35;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:750;cursor:pointer}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.primary{background:var(--gold);border-color:var(--gold);color:#111}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#101318;border:1px solid var(--line);border-radius:13px;padding:12px}.metric b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.metric span{font-size:24px;font-weight:850}.pill{background:#11151a;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}.bad{color:#e0a6a6}.good{color:#79c79d}canvas{width:100%;height:320px;background:#101318;border:1px solid var(--line);border-radius:15px;margin-top:12px}@media(max-width:850px){.grid,.row{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="head"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M006</div><div class="title">Percent Factor Lab</div><div class="sub">Build successive percent changes as multipliers and compare them with the tempting additive shortcut.</div></div>
<div class="grid"><div class="card"><h2>Inputs</h2><label>Original value</label><input id="v" type="number" step=".01" value="100"><div class="row"><div><label>First change (%)</label><input id="p1" type="number" step=".1" value="20"></div><div><label>Second change (%)</label><input id="p2" type="number" step=".1" value="-20"></div></div><div class="buttons"><button class="primary" id="classic">+20%, then −20%</button><button id="grow">+10%, then +10%</button><button id="drop">−25%, then −10%</button></div><div class="pill">Use signed percentages: + means increase, − means decrease.</div></div>
<div class="card"><h2>Live result</h2><div class="metricgrid"><div class="metric"><b>Factor 1</b><span id="f1"></span></div><div class="metric"><b>Factor 2</b><span id="f2"></span></div><div class="metric"><b>Combined</b><span id="fc"></span></div></div><div class="pill" id="work"></div><div class="pill" id="trap"></div></div></div><div class="card" style="margin-top:18px"><canvas id="g" width="1100" height="360"></canvas></div></div>
<script>
const $=x=>document.getElementById(x),fmt=n=>(Math.round(n*1000)/1000).toString();
function update(){let v=+$('v').value,p1=+$('p1').value,p2=+$('p2').value,f1=1+p1/100,f2=1+p2/100,mid=v*f1,fin=mid*f2,add=v*(1+(p1+p2)/100);$('f1').textContent=fmt(f1);$('f2').textContent=fmt(f2);$('fc').textContent=fmt(f1*f2);$('work').innerHTML=`Correct: <b>${fmt(v)} × ${fmt(f1)} = ${fmt(mid)}; ${fmt(mid)} × ${fmt(f2)} = ${fmt(fin)}</b><br>Net percent change = <b>${fmt((fin/v-1)*100)}%</b>`;$('trap').innerHTML=`Tempting additive shortcut gives <b>${fmt(add)}</b>. ${Math.abs(add-fin)>1e-9?'<span class="bad">Different base → shortcut fails.</span>':'<span class="good">Here it happens to match.</span>'}`;draw(v,mid,fin)}
function draw(a,b,c){let cv=$('g'),q=cv.getContext('2d'),w=cv.width,h=cv.height;q.clearRect(0,0,w,h);q.fillStyle='#101318';q.fillRect(0,0,w,h);let max=Math.max(Math.abs(a),Math.abs(b),Math.abs(c),1),vals=[a,b,c],labs=['Original','After change 1','After change 2'],cols=['#4d82c4','#8064a8','#b9913e'];vals.forEach((v,i)=>{let x=120+i*340,bh=Math.abs(v)/max*230,y=h-55-bh;q.fillStyle=cols[i];q.fillRect(x,y,170,bh);q.fillStyle='#f4f5f6';q.font='18px system-ui';q.fillText(labs[i],x,y-12);q.fillText(fmt(v),x+55,h-25)})}
['v','p1','p2'].forEach(id=>$(id).oninput=update);$('classic').onclick=()=>{$('v').value=100;$('p1').value=20;$('p2').value=-20;update()};$('grow').onclick=()=>{$('v').value=100;$('p1').value=10;$('p2').value=10;update()};$('drop').onclick=()=>{$('v').value=200;$('p1').value=-25;$('p2').value=-10;update()};update();
</script></body></html>
