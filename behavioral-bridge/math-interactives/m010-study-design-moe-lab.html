<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M010 Study Design & MOE Lab</title><style>
:root{--bg:#0f1115;--panel:#1a1e24;--ink:#f4f5f6;--muted:#aeb4be;--line:#343a44;--gold:#b9913e;--blue:#4d82c4;--green:#4e9a72;--red:#b96767;--purple:#8064a8;--orange:#c27a38}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0d0f12,#15181d);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px}.head,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.head{margin-bottom:18px}
.brand{font-size:13px;letter-spacing:.14em;font-weight:800;color:#d8dbe0}.title{font-size:34px;font-weight:850;margin:7px 0 3px}.sub,.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:750;margin:10px 0 5px;color:#d8dce2}input,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #3b424e;background:#101318;color:var(--ink);font:inherit}
input[type=range]{padding:0;border:none;background:transparent}
button{border:1px solid #434b58;background:#262c35;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:750;cursor:pointer}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.primary{background:var(--gold);border-color:var(--gold);color:#111}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#101318;border:1px solid var(--line);border-radius:13px;padding:12px}
.metric b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.metric span{font-size:23px;font-weight:850}
canvas{width:100%;height:420px;background:#101318;border:1px solid var(--line);border-radius:15px;margin-top:12px}.pill{background:#11151a;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}
.good{color:#79c79d}.bad{color:#e0a6a6}.gold{color:var(--gold)}.blue{color:#75a5e0}.small{font-size:13px}
@media(max-width:850px){.grid,.row{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="wrap"><div class="head"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M010</div><div class="title">Study Design + Margin-of-Error Lab</div><div class="sub">Separate population scope from causation, then explore how sample size changes margin of error.</div></div>
<div class="grid"><div class="card"><h2>Design permissions</h2><label><input id="sample" type="checkbox" style="width:auto"> Random sample from the named population</label><label><input id="assign" type="checkbox" style="width:auto"> Random assignment to treatment</label><label>Source population</label><select id="pop"><option>students in the district</option><option>registered voters in the state</option><option>patients at the participating clinics</option></select><div class="buttons"><button class="primary" id="both">Both</button><button id="sampleOnly">Sample only</button><button id="assignOnly">Assignment only</button><button id="neither">Neither</button></div><div class="pill" id="claim"></div></div>
<div class="card"><h2>MOE scaling</h2><div class="row"><div><label>Original sample n₀</label><input id="n0" type="number" min="1" value="400"></div><div><label>Original MOE</label><input id="e0" type="number" min=".01" step=".1" value="4"></div></div><label>New sample n₁</label><input id="n1" type="range" min="100" max="6400" step="100" value="1600"><div id="n1v"></div><div class="metricgrid"><div class="metric"><b>n factor</b><span id="nf"></span></div><div class="metric"><b>√factor</b><span id="sf"></span></div><div class="metric"><b>New MOE</b><span id="e1"></span></div></div><div class="pill" id="moeExplain"></div></div></div></div>
<script>
const $=id=>document.getElementById(id),fmt=n=>(Math.round(n*1000)/1000).toString();
function design(){const s=$('sample').checked,a=$('assign').checked,p=$('pop').value;let t;if(s&&a)t=`You may support a <b>causal conclusion for ${p}</b>: sampling gives population reach; assignment gives causal permission.`;else if(s)t=`You may <b>generalize an association to ${p}</b>, but you may not claim causation without random assignment.`;else if(a)t=`You may support a <b>causal conclusion for the studied participants</b>, but the design does not justify generalizing to all ${p}.`;else t=`Describe <b>association only for the observed group</b>. No random sample = no broad population reach; no random assignment = no causal claim.`;$('claim').innerHTML=t}
function moe(){const n0=Math.max(1,+$('n0').value),e0=Math.max(.0001,+$('e0').value),n1=Math.max(1,+$('n1').value),f=n1/n0,s=Math.sqrt(f),e=e0/s;$('n1v').textContent=n1;$('nf').textContent=fmt(f);$('sf').textContent=fmt(s);$('e1').textContent=fmt(e);$('moeExplain').innerHTML=`Approximation: new MOE = original MOE ÷ √(n₁/n₀) = <b>${fmt(e0)} ÷ ${fmt(s)} = ${fmt(e)}</b>.`}
['sample','assign','pop'].forEach(id=>$(id).onchange=design);['n0','e0','n1'].forEach(id=>$(id).oninput=moe);
$('both').onclick=()=>{$('sample').checked=true;$('assign').checked=true;design()};$('sampleOnly').onclick=()=>{$('sample').checked=true;$('assign').checked=false;design()};$('assignOnly').onclick=()=>{$('sample').checked=false;$('assign').checked=true;design()};$('neither').onclick=()=>{$('sample').checked=false;$('assign').checked=false;design()};design();moe();
</script></body></html>
