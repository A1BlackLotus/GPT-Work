<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M017 Circle Equation Lab</title>
<style>
:root{--panel:#1a1e24;--ink:#f4f5f6;--muted:#aeb4be;--line:#343a44;--gold:#b9913e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0f12,#15181d);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.head,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.head{margin-bottom:18px}.brand{font-size:13px;letter-spacing:.14em;font-weight:800;color:#d8dbe0}.title{font-size:34px;font-weight:850;margin:7px 0 3px}.sub,.muted{color:var(--muted)}.gold{color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:750;margin:10px 0 5px;color:#d8dce2}input{width:100%}button{border:1px solid #434b58;background:#262c35;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:750;cursor:pointer}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.primary{background:var(--gold);border-color:var(--gold);color:#111}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#101318;border:1px solid var(--line);border-radius:13px;padding:12px}.metric b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.metric span{font-size:22px;font-weight:850}.pill{background:#11151a;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}canvas{width:100%;height:440px;background:#101318;border:1px solid var(--line);border-radius:15px;margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="head"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M017</div><div class="title">Circle Equation Lab</div><div class="sub">Change center + radius and watch <span class="gold">(x − h)² + (y − k)² = r²</span> update live.</div></div>
<div class="grid"><div class="card"><h2>Circle controls</h2><label>h — center x</label><input id="h" type="range" min="-5" max="5" step=".5" value="0"><div id="hv"></div><label>k — center y</label><input id="k" type="range" min="-5" max="5" step=".5" value="0"><div id="kv"></div><label>r — radius</label><input id="r" type="range" min=".5" max="6" step=".5" value="3"><div id="rv"></div><div class="buttons"><button class="primary" id="base">Center (0,0), r=3</button><button id="move">Center (2,−1), r=4</button></div></div>
<div class="card"><h2>Equation decoder</h2><div class="metricgrid"><div class="metric"><b>Center</b><span id="center"></span></div><div class="metric"><b>Radius</b><span id="rad"></span></div><div class="metric"><b>r²</b><span id="rsq"></span></div></div><div class="pill" id="eq"></div><div class="pill"><b>Sign trap:</b> x − h means center x = h. So (x + 2)² has center x = −2.</div></div></div><div class="card" style="margin-top:18px"><canvas id="g" width="1100" height="520"></canvas></div></div>
<script>
const $=x=>document.getElementById(x),fmt=n=>(Math.round(n*100)/100).toString();
function update(){let h=+$('h').value,k=+$('k').value,r=+$('r').value;$('hv').textContent=fmt(h);$('kv').textContent=fmt(k);$('rv').textContent=fmt(r);$('center').textContent=`(${fmt(h)}, ${fmt(k)})`;$('rad').textContent=fmt(r);$('rsq').textContent=fmt(r*r);$('eq').innerHTML=`<b>(x ${h>=0?'−':'+'} ${fmt(Math.abs(h))})² + (y ${k>=0?'−':'+'} ${fmt(Math.abs(k))})² = ${fmt(r*r)}</b>`;draw(h,k,r)}
function draw(h,k,r){let c=$('g'),q=c.getContext('2d'),w=c.width,hh=c.height,X=x=>w/2+x*45,Y=y=>hh/2-y*45;q.clearRect(0,0,w,hh);q.fillStyle='#101318';q.fillRect(0,0,w,hh);q.strokeStyle='#343a44';q.lineWidth=1;for(let i=-11;i<=11;i++){q.beginPath();q.moveTo(X(i),0);q.lineTo(X(i),hh);q.stroke()}for(let i=-6;i<=6;i++){q.beginPath();q.moveTo(0,Y(i));q.lineTo(w,Y(i));q.stroke()}q.strokeStyle='#737b88';q.lineWidth=2;q.beginPath();q.moveTo(0,Y(0));q.lineTo(w,Y(0));q.stroke();q.beginPath();q.moveTo(X(0),0);q.lineTo(X(0),hh);q.stroke();q.strokeStyle='#b9913e';q.lineWidth=5;q.beginPath();q.arc(X(h),Y(k),r*45,0,Math.PI*2);q.stroke();q.fillStyle='#f4f5f6';q.beginPath();q.arc(X(h),Y(k),7,0,Math.PI*2);q.fill();q.strokeStyle='#4d82c4';q.lineWidth=4;q.beginPath();q.moveTo(X(h),Y(k));q.lineTo(X(h+r),Y(k));q.stroke()}
['h','k','r'].forEach(id=>$(id).oninput=update);$('base').onclick=()=>{$('h').value=0;$('k').value=0;$('r').value=3;update()};$('move').onclick=()=>{$('h').value=2;$('k').value=-1;$('r').value=4;update()};update();
</script></body></html>
