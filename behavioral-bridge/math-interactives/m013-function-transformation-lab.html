<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M013 Function Transformation Lab</title>
<style>
:root{--panel:#1a1e24;--ink:#f4f5f6;--muted:#aeb4be;--line:#343a44;--gold:#b9913e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0d0f12,#15181d);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px}.head,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.head{margin-bottom:18px}.brand{font-size:13px;letter-spacing:.14em;font-weight:800;color:#d8dbe0}.title{font-size:34px;font-weight:850;margin:7px 0 3px}.sub,.muted{color:var(--muted)}.gold{color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:750;margin:10px 0 5px;color:#d8dce2}input{width:100%}button{border:1px solid #434b58;background:#262c35;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:750;cursor:pointer}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.primary{background:var(--gold);border-color:var(--gold);color:#111}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#101318;border:1px solid var(--line);border-radius:13px;padding:12px}.metric b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.metric span{font-size:22px;font-weight:850}.pill{background:#11151a;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}canvas{width:100%;height:440px;background:#101318;border:1px solid var(--line);border-radius:15px;margin-top:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="head"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M013</div><div class="title">Function Transformation Lab</div><div class="sub">Control <span class="gold">y = a(x − h)² + k</span> and watch the vertex, reflection, and vertical stretch change live.</div></div>
<div class="grid"><div class="card"><h2>Parameters</h2><label>a — vertical scale / reflection</label><input id="a" type="range" min="-3" max="3" step=".25" value="1"><div id="av"></div><label>h — horizontal shift</label><input id="h" type="range" min="-5" max="5" step=".5" value="0"><div id="hv"></div><label>k — vertical shift</label><input id="k" type="range" min="-5" max="5" step=".5" value="0"><div id="kv"></div><div class="buttons"><button class="primary" id="base">Parent</button><button id="shift">Shift right 2, up 3</button><button id="flip">Reflect + stretch</button></div></div>
<div class="card"><h2>Feature readout</h2><div class="metricgrid"><div class="metric"><b>Vertex</b><span id="vertex"></span></div><div class="metric"><b>Opens</b><span id="opens"></span></div><div class="metric"><b>Width</b><span id="width"></span></div></div><div class="pill" id="eq"></div><div class="pill"><b>Inside sign acts opposite:</b> (x − h) shifts right when h &gt; 0.</div></div></div><div class="card" style="margin-top:18px"><canvas id="g" width="1100" height="520"></canvas></div></div>
<script>
const $=x=>document.getElementById(x),fmt=n=>(Math.round(n*100)/100).toString();
function update(){let a=+$('a').value,h=+$('h').value,k=+$('k').value;if(Math.abs(a)<.001)a=.001;$('av').textContent=fmt(a);$('hv').textContent=fmt(h);$('kv').textContent=fmt(k);$('vertex').textContent=`(${fmt(h)}, ${fmt(k)})`;$('opens').textContent=a>0?'up':'down';$('width').textContent=Math.abs(a)>1?'narrower':Math.abs(a)<1?'wider':'parent';$('eq').innerHTML=`<b>y = ${fmt(a)}(x ${h>=0?'−':'+'} ${fmt(Math.abs(h))})² ${k>=0?'+':'−'} ${fmt(Math.abs(k))}</b>`;draw(a,h,k)}
function draw(a,h,k){let c=$('g'),q=c.getContext('2d'),w=c.width,hh=c.height,X=x=>w/2+x*48,Y=y=>hh/2-y*42;q.clearRect(0,0,w,hh);q.fillStyle='#101318';q.fillRect(0,0,w,hh);q.strokeStyle='#343a44';q.lineWidth=1;for(let i=-10;i<=10;i++){q.beginPath();q.moveTo(X(i),0);q.lineTo(X(i),hh);q.stroke()}for(let i=-6;i<=6;i++){q.beginPath();q.moveTo(0,Y(i));q.lineTo(w,Y(i));q.stroke()}q.strokeStyle='#737b88';q.lineWidth=2;q.beginPath();q.moveTo(0,Y(0));q.lineTo(w,Y(0));q.stroke();q.beginPath();q.moveTo(X(0),0);q.lineTo(X(0),hh);q.stroke();q.strokeStyle='#b9913e';q.lineWidth=5;q.beginPath();let first=true;for(let x=-10;x<=10;x+=.04){let y=a*(x-h)*(x-h)+k,px=X(x),py=Y(y);if(first){q.moveTo(px,py);first=false}else q.lineTo(px,py)}q.stroke();q.fillStyle='#f4f5f6';q.beginPath();q.arc(X(h),Y(k),7,0,Math.PI*2);q.fill()}
['a','h','k'].forEach(id=>$(id).oninput=update);$('base').onclick=()=>{$('a').value=1;$('h').value=0;$('k').value=0;update()};$('shift').onclick=()=>{$('a').value=1;$('h').value=2;$('k').value=3;update()};$('flip').onclick=()=>{$('a').value=-2;$('h').value=-1;$('k').value=2;update()};update();
</script></body></html>
