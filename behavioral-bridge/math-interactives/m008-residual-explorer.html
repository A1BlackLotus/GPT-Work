<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M008 Residual Explorer</title><style>
:root{--bg:#0f1115;--panel:#1a1e24;--ink:#f4f5f6;--muted:#aeb4be;--line:#343a44;--gold:#b9913e;--blue:#4d82c4;--green:#4e9a72;--red:#b96767;--purple:#8064a8;--orange:#c27a38}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0d0f12,#15181d);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px}.head,.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.head{margin-bottom:18px}
.brand{font-size:13px;letter-spacing:.14em;font-weight:800;color:#d8dbe0}.title{font-size:34px;font-weight:850;margin:7px 0 3px}.sub,.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:750;margin:10px 0 5px;color:#d8dce2}input,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #3b424e;background:#101318;color:var(--ink);font:inherit}
input[type=range]{padding:0;border:none;background:transparent}
button{border:1px solid #434b58;background:#262c35;color:var(--ink);padding:10px 13px;border-radius:11px;font-weight:750;cursor:pointer}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.primary{background:var(--gold);border-color:var(--gold);color:#111}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:#101318;border:1px solid var(--line);border-radius:13px;padding:12px}
.metric b{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.metric span{font-size:23px;font-weight:850}
canvas{width:100%;height:420px;background:#101318;border:1px solid var(--line);border-radius:15px;margin-top:12px}.pill{background:#11151a;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:9px}
.good{color:#79c79d}.bad{color:#e0a6a6}.gold{color:var(--gold)}.blue{color:#75a5e0}.small{font-size:13px}
@media(max-width:850px){.grid,.row{grid-template-columns:1fr}.metricgrid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="wrap"><div class="head"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M008</div><div class="title">Residual Explorer</div><div class="sub">Change a model and an observed point. Predict whether the point is above or below the model before reading the residual.</div></div>
<div class="grid"><div class="card"><h2>Model y = mx + b</h2><div class="row"><div><label>Slope m</label><input id="m" type="number" step=".1" value="1.8"></div><div><label>Intercept b</label><input id="b" type="number" step=".1" value="4.2"></div></div><div class="row"><div><label>Observed x</label><input id="x" type="number" step=".5" value="10"></div><div><label>Observed y</label><input id="y" type="number" step=".5" value="21"></div></div><div class="buttons"><button class="primary" id="below">Below-model example</button><button id="above">Above-model example</button><button id="on">On-model example</button></div></div>
<div class="card"><h2>Live readout</h2><div class="metricgrid"><div class="metric"><b>Predicted y</b><span id="pred"></span></div><div class="metric"><b>Residual O−P</b><span id="res"></span></div><div class="metric"><b>Position</b><span id="pos"></span></div></div><div class="pill" id="explain"></div></div></div>
<div class="card" style="margin-top:18px"><canvas id="g" width="1100" height="500"></canvas></div></div>
<script>
const $=id=>document.getElementById(id),fmt=n=>(Math.round(n*1000)/1000).toString();
function update(){const m=+$('m').value,b=+$('b').value,x=+$('x').value,y=+$('y').value,p=m*x+b,r=y-p;$('pred').textContent=fmt(p);$('res').textContent=fmt(r);const pos=Math.abs(r)<1e-9?'on model':r>0?'above':'below';$('pos').textContent=pos;$('explain').innerHTML=`Residual = observed − predicted = <b>${fmt(y)} − ${fmt(p)} = ${fmt(r)}</b>. `+(r>0?'<span class="good">Positive means the observed point is above the model.</span>':r<0?'<span class="bad">Negative means the observed point is below the model.</span>':'The point lies on the model.');draw(m,b,x,y,p)}
function draw(m,b,x,y,p){const c=$('g'),q=c.getContext('2d'),w=c.width,h=c.height;q.clearRect(0,0,w,h);q.fillStyle='#101318';q.fillRect(0,0,w,h);const xmin=-2,xmax=16;let vals=[m*xmin+b,m*xmax+b,y,p],ymin=Math.min(...vals)-4,ymax=Math.max(...vals)+4;const X=v=>70+(v-xmin)/(xmax-xmin)*(w-140),Y=v=>h-55-(v-ymin)/(ymax-ymin)*(h-105);q.strokeStyle='#4d82c4';q.lineWidth=5;q.beginPath();q.moveTo(X(xmin),Y(m*xmin+b));q.lineTo(X(xmax),Y(m*xmax+b));q.stroke();q.strokeStyle='#59616e';q.lineWidth=2;q.beginPath();q.moveTo(X(x),Y(p));q.lineTo(X(x),Y(y));q.stroke();q.fillStyle='#4d82c4';q.beginPath();q.arc(X(x),Y(p),7,0,Math.PI*2);q.fill();q.fillStyle=y>p?'#4e9a72':y<p?'#b96767':'#f4f5f6';q.beginPath();q.arc(X(x),Y(y),9,0,Math.PI*2);q.fill();q.fillStyle='#aeb4be';q.font='16px system-ui';q.fillText('predicted',X(x)+14,Y(p)+4);q.fillText('observed',X(x)+14,Y(y)+4)}
['m','b','x','y'].forEach(id=>$(id).oninput=update);$('below').onclick=()=>{$('m').value=1.8;$('b').value=4.2;$('x').value=10;$('y').value=21;update()};$('above').onclick=()=>{$('m').value=1.8;$('b').value=4.2;$('x').value=10;$('y').value=24;update()};$('on').onclick=()=>{$('m').value=2;$('b').value=1;$('x').value=5;$('y').value=11;update()};update();
</script></body></html>
