<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Bridge — M021 Visual Retrieval Deck</title><style>:root{--p:#1a1e24;--ink:#f5f6f7;--muted:#adb4be;--line:#343b46;--gold:#b9913e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0d0f12,#15191e);color:var(--ink);font:16px/1.45 system-ui}.w{max-width:1000px;margin:auto;padding:28px}.card{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px}.brand{font-size:13px;font-weight:850;letter-spacing:.14em}.title{font-size:34px;font-weight:850;margin:6px 0}.muted{color:var(--muted)}.flash{min-height:330px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#111419;border:1px solid var(--line);border-radius:18px;padding:28px;cursor:pointer}.cue{font-size:30px;font-weight:850;max-width:780px}.answer{font-size:21px;margin-top:22px;color:var(--gold);display:none}.buttons{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:15px}button{padding:10px 14px;border-radius:11px;border:1px solid #454d59;background:#262d36;color:var(--ink);font-weight:750;cursor:pointer}.primary{background:var(--gold);color:#111;border-color:var(--gold)}.progress{text-align:center;color:var(--muted);margin-top:10px}</style></head><body><div class="w"><div class="card"><div class="brand">BEHAVIORAL BRIDGE · SAT MATH · M021</div><div class="title">Visual Retrieval Deck</div><div class="muted">See the cue. Retrieve the route. Then reveal. This is for fast recognition—not passive rereading.</div></div><div class="card"><div class="flash" id="flash"><div class="cue" id="cue"></div><div class="answer" id="ans"></div></div><div class="buttons"><button id="prev">Previous</button><button class="primary" id="reveal">Reveal route</button><button id="next">Next</button><button id="shuffle">Shuffle</button></div><div class="progress" id="p"></div></div></div><script>
let d=[['Variables cancel and a false statement remains.','Linear equation → NO SOLUTION. Compare coefficients/constants; do not force a numeric x.'],['Two points define a line.','Compute slope → choose a clean line form → connect intercept/point → prove with a point.'],['Two equations must be true at the same ordered pair.','Systems → intersection. Algebra or Desmos depending on structure; verify in both equations.'],['Repeated percent growth or decay.','Exponential → factor = 1 ± p/100 when p is written as a percentage.'],['Quadratic asks for zeros.','Choose factored form/factoring, quadratic formula, completing square, or Desmos based on structure.'],['A transformed function shifts right by h.','Inside change uses opposite-looking sign: f(x−h) shifts right h.'],['Random assignment is present.','Experiment → causal inference may be justified for the study context; sampling controls generalization.'],['Scale factor k changes every linear dimension.','Length ×k, area ×k², volume ×k³. Name the requested quantity first.'],['Right triangle: angle + side → missing side.','SOHCAHTOA unless 30-60-90 or 45-45-90 gives a cleaner special-triangle route.'],['Circle in standard form.','(x−h)²+(y−k)²=r² → center (h,k), radius r.'],['Messy decimal intersection.','Desmos is often the faster executor after correct representation.'],['Mixed problem and you feel the urge to calculate immediately.','Stop: CLASSIFY → ACTIVATE → PREDICT → PROVE. Route before arithmetic.']];let i=0;const $=x=>document.getElementById(x);function show(){let z=d[i];$('cue').textContent=z[0];$('ans').textContent=z[1];$('ans').style.display='none';$('p').textContent=(i+1)+' / '+d.length}$('reveal').onclick=()=>$('ans').style.display='block';$('flash').onclick=()=>$('ans').style.display='block';$('next').onclick=()=>{i=(i+1)%d.length;show()};$('prev').onclick=()=>{i=(i-1+d.length)%d.length;show()};$('shuffle').onclick=()=>{for(let j=d.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[d[j],d[k]]=[d[k],d[j]]}i=0;show()};show();
</script></body></html>
