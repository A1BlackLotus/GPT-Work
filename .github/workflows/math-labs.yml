name: Math lab regression checks
on:
  pull_request:
    paths: ['behavioral-bridge/math-interactives/**', 'tests/**', 'package*.json', '.github/workflows/math-labs.yml']
  push:
    branches: [main]
    paths: ['behavioral-bridge/math-interactives/**', 'tests/**', 'package*.json', '.github/workflows/math-labs.yml']
permissions:
  contents: read
jobs:
  math-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
