name: Math lab regression checks
on:
  pull_request:
    paths: ['behavioral-bridge/math-interactives/**', 'tests/**', 'package*.json', '.github/workflows/math-labs.yml']
  push:
    branches: [main]
    paths: ['behavioral-bridge/math-interactives/**', 'tests/**', 'package*.json', '.github/workflows/math-labs.yml']
permissions:
  contents: read
jobs:
  math-labs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
